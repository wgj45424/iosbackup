name: docker-amd64
run-name: Publish linux/amd64 @ ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-amd64-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish x86_64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Load validated release metadata
        shell: bash
        run: ./scripts/read_release_manifest.sh release/manifest.env > "$GITHUB_ENV"

      - name: Set image name
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        # docker/login-action v4.7.0
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.4.1; Buildx v0.36.1; BuildKit v0.32.2
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.36.1
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build and push linux/amd64 image
        # docker/build-push-action v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          provenance: mode=max,version=v1
          sbom: false
          tags: |
            ${{ env.IMAGE }}:amd64
            ${{ env.IMAGE }}:sha-${{ github.sha }}-amd64
          labels: |
            org.opencontainers.image.created=${{ env.IOSBK_BUILD_DATE }}T00:00:00Z
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.IOSBK_VERSION }}
          build-args: |
            IOSBK_VERSION=${{ env.IOSBK_VERSION }}
            IOSBK_BUILD_DATE=${{ env.IOSBK_BUILD_DATE }}
            IOSBK_COMMIT=${{ github.sha }}
            IOSBK_SOURCE_URL=https://github.com/${{ github.repository }}

      - name: Verify anonymous pull and print command
        shell: bash
        run: |
          set -euo pipefail
          anonymous_config="$(mktemp -d "$RUNNER_TEMP/iosbackup-anonymous.XXXXXX")"
          trap 'rm -rf "$anonymous_config"' EXIT
          if ! docker --config "$anonymous_config" pull --platform linux/amd64 "$IMAGE:amd64"; then
            echo "::error::Anonymous pull failed. In GitHub Packages, set this container package visibility to Public, then rerun the workflow."
            exit 1
          fi
          test "$(docker image inspect "$IMAGE:amd64" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
          {
            echo '### Anonymous pull (no docker login required)'
            echo '```bash'
            echo "docker pull --platform linux/amd64 $IMAGE:amd64"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
